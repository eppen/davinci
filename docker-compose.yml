services:
  mysql:
    image: mysql:8.0
    container_name: davinci-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: davinci0.3
    volumes:
      - davinci-mysql-data:/var/lib/mysql
      - ./bin/davinci.sql:/docker-entrypoint-initdb.d/01-davinci.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  davinci-mysql-data:
