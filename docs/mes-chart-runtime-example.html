<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>MES Chart Runtime 试点页</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@4/dist/echarts.min.js"></script>
  <script src="/static/mes-chart-runtime.js?v=1.0.0"></script>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    .chart-box { width: 100%; height: 320px; margin-bottom: 16px; border: 1px solid #e8e8e8; }
  </style>
</head>
<body>
  <h3>产线看板试点（Widget 嵌入）</h3>
  <div id="outputChart" class="chart-box"></div>
  <div id="yieldChart" class="chart-box"></div>
  <script>
    var baseUrl = 'http://127.0.0.1:8080/api/v3'
    var token = '' // MES JWT，或由 Davinci login/mes-token 换取
    var params = { plant: 'P01', line: 'L03', shift: 'A' }

    MesChartRuntime.mount('#outputChart', {
      baseUrl: baseUrl,
      widgetId: 1,
      token: token,
      params: params,
      height: 320
    })

    MesChartRuntime.mount('#yieldChart', {
      baseUrl: baseUrl,
      widgetId: 2,
      token: token,
      params: params,
      height: 320,
      refreshInterval: 60000
    })
  </script>
</body>
</html>
